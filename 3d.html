<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RIPOSTE — 3D edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #07040b; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; line-height: 0; }
  #view3d { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #game { position: relative; display: block; }   /* the game's own canvas: here it only carries the HUD, over the 3D view */
  #note { position: fixed; left: 0; right: 0; top: 40%; text-align: center; color: #f3ecdf; font: 16px Georgia, serif; }
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="wrap"><canvas id="view3d"></canvas><canvas id="game"></canvas></div>
<div id="note">Loading the 3D view…</div>
<script>
  // The real game runs underneath, untouched: same rules, same enemies. This page only replaces how it is drawn.
  const s = document.createElement('script');
  s.src = 'game.js?v=' + Date.now();
  s.onload = () => import('./view3d.js?v=' + Date.now()).then(() => document.getElementById('note').remove())
    .catch(e => { document.getElementById('note').textContent = 'The 3D view could not start: ' + e.message; console.error(e); });
  document.body.appendChild(s);
</script>
</body>
</html>
